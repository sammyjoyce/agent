# The coordinator owns shared settings, conversations and background intake.
# Additional context repositories are optional and do not change the chat's cwd.
context_repositories = []
# Git-managed job directories. Validate and apply changes with agent jobs sync.
job_directories = []
# Seconds a task terminal stays on finished work before the coordinator
# releases it and Rex closes its pane. The default is 900.
# observer_release_after_seconds = 900

# Defaults for new work. Existing tasks keep their saved model selection.
[model]
provider = "openai"
model_id = "gpt-6.1-sol"
reasoning = "high"
fast = false

# Discover all Google mail accounts already configured in Switchboard.
[[sources]]
provider = "google"
enabled = true

# Each feed can be disabled without removing its configuration.
[[sources]]
provider = "google_calendar"
enabled = true

[[sources]]
provider = "github"
enabled = true

# Messages reads local macOS history and preserves unread state.
[[sources]]
provider = "messages"
enabled = false

# Dreams proposes reviewed edits to one private guidance repository. Keep the
# check program outside that repository. See docs/setup.md#dreams.
# [dreams]
# repository = "/Users/example/context"
# editable = ["AGENTS.md", "playbooks/*.md"]
# window_hours = 24
#
# [[dreams.checks]]
# name = "commands-exist"
# argv = ["/bin/sh", "/Users/example/dreams-checks/commands-exist.sh"]
# timeout_seconds = 60
